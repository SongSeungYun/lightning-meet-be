server:
  port: 8080

spring:
  index:

  application:
    name: lightning-meet-be
  datasource:
    url: jdbc:mysql://mysql:3306/lightning_meet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect  # ← 추가하면 dialect 오류 방지됨

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: 6379

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: lightning-group
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:default-secret}
  access-exp: ${JWT_ACCESS_EXP:3600000}
  refresh-exp: ${JWT_REFRESH_EXP:1209600000}